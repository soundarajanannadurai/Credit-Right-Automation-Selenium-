name: Selenium Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Upload reports and screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-results
          path: |
            screenshots/
          if-no-files-found: ignore